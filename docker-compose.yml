services:
  db:
    # Plain Postgres: the territory grid uses integer slippy-tile coordinates,
    # not geometry columns, so PostGIS was never used. Pinned to bullseye to
    # match the glibc/collation of the previous image.
    image: postgres:16-bullseye
    container_name: runturf-db
    environment:
      POSTGRES_USER: runturf
      POSTGRES_PASSWORD: runturf_dev
      POSTGRES_DB: runturf
    ports:
      # 5433 on the host: a native PostgreSQL service already owns 5432 on this machine
      - "5433:5432"
    volumes:
      - runturf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runturf -d runturf"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Containerised API. Opt-in via a profile so the default `docker compose up`
  # stays DB-only (local dev runs the API on the host with `npm run dev:api`).
  # Run the full stack with: docker compose --profile app up --build
  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: runturf-api
    environment:
      # Reaches the db service over the compose network on the container port.
      DATABASE_URL: postgres://runturf:runturf_dev@db:5432/runturf
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-3f9a2b}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      NODE_ENV: production
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  runturf_pgdata:
